name: Release

# Builda l'app per Mac e Windows e allega gli installer alla GitHub Release
# corrispondente al tag pushato (es. v0.1.0). Il backend Python va compilato
# separatamente su ogni piattaforma — non è un binario cross-platform,
# quindi ogni job crea il proprio venv nativo prima di impacchettare.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze root (Electron)
        run: npm ci

      - name: Crea venv e installa dipendenze backend (macOS)
        if: runner.os != 'Windows'
        working-directory: backend
        run: |
          python3 -m venv venv
          ./venv/bin/pip install -r requirements.txt

      - name: Crea venv e installa dipendenze backend (Windows)
        if: runner.os == 'Windows'
        working-directory: backend
        run: |
          python -m venv venv
          .\venv\Scripts\pip install -r requirements.txt

      - name: Build frontend
        run: npm run build:frontend

      - name: Build e pubblica su GitHub Release
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
