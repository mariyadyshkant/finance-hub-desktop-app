name: Release

# Builda l'app per Mac e Windows e allega gli installer alla GitHub Release
# corrispondente al tag pushato (es. v0.1.0). Il backend Python viene
# congelato con PyInstaller in un eseguibile standalone per ciascuna
# piattaforma — un venv "normale" non è mai portabile (si appoggia sempre
# all'installazione Python della macchina che l'ha creato), quindi ogni job
# lo compila da zero sul proprio runner nativo prima di impacchettare.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze root (Electron)
        run: npm ci

      - name: Installa dipendenze frontend (Svelte/Vite)
        working-directory: frontend
        run: npm ci

      - name: Installa dipendenze backend + PyInstaller
        working-directory: backend
        run: pip install -r requirements.txt pyinstaller

      - name: Congela il backend con PyInstaller
        working-directory: backend
        run: >
          pyinstaller --name financed-backend --onefile
          --hidden-import uvicorn.logging
          --hidden-import uvicorn.loops
          --hidden-import uvicorn.loops.auto
          --hidden-import uvicorn.protocols
          --hidden-import uvicorn.protocols.http
          --hidden-import uvicorn.protocols.http.auto
          --hidden-import uvicorn.protocols.websockets
          --hidden-import uvicorn.protocols.websockets.auto
          --hidden-import uvicorn.lifespan
          --hidden-import uvicorn.lifespan.on
          main.py

      - name: Build frontend
        run: npm run build:frontend

      - name: Build e pubblica su GitHub Release
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
